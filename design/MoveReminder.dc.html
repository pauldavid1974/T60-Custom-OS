<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Move reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#8CC8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C0F; color: #F2F4F7; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
<a href="Alerts.dc.html" aria-label="Back to Alerts" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5AB0FF; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Move reminder</h1>
</header>

<main style="flex: 1; overflow: hidden; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<p style="margin: 0 4px; font-size: 14px; color: #C9D1DB; line-height: 1.5">Your watch buzzes when you have been sitting too long.</p>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 4px 16px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px">
<span style="font-size: 15px; font-weight: 600">Remind me to move</span>
<button aria-pressed="{{sw.s0.on}}" aria-label="Remind me to move" onClick="{{sw.s0.toggle}}" style="width: 50px; height: 30px; border: 0; border-radius: 999px; background: {{sw.s0.bg}}; padding: 3px; display: flex; justify-content: {{sw.s0.jc}}; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: {{sw.s0.knob}}"></span></button>
</div>
</section>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #9AA4B2">After sitting for</h2>
<div role="group" aria-label="After sitting for" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-pressed="{{g.g0.o0.on}}" onClick="{{g.g0.o0.pick}}" style="height: 48px; border-radius: 14px; border: {{g.g0.o0.v0}}; background: {{g.g0.o0.v1}}; color: {{g.g0.o0.v2}}; font: {{g.g0.o0.v3}}; cursor: pointer">30 min</button>
<button aria-pressed="{{g.g0.o1.on}}" onClick="{{g.g0.o1.pick}}" style="height: 48px; border-radius: 14px; border: {{g.g0.o1.v0}}; background: {{g.g0.o1.v1}}; color: {{g.g0.o1.v2}}; font: {{g.g0.o1.v3}}; cursor: pointer">1 hour</button>
<button aria-pressed="{{g.g0.o2.on}}" onClick="{{g.g0.o2.pick}}" style="height: 48px; border-radius: 14px; border: {{g.g0.o2.v0}}; background: {{g.g0.o2.v1}}; color: {{g.g0.o2.v2}}; font: {{g.g0.o2.v3}}; cursor: pointer">90 min</button>
</div>
</section>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 14px; font-weight: 700; color: #9AA4B2">Only between</h2>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9AA4B2">From<input value="9:00 AM" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2B3440; background: #1A2028; color: #F2F4F7; font: 600 17px 'IBM Plex Mono', monospace; text-align: center"></label>
<span style="padding-top: 18px; color: #9AA4B2">to</span>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #9AA4B2">Until<input value="5:00 PM" style="height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid #2B3440; background: #1A2028; color: #F2F4F7; font: 600 17px 'IBM Plex Mono', monospace; text-align: center"></label>
</div>
<div role="group" aria-label="On these days" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<button aria-pressed="{{g.g1.o0.on}}" onClick="{{g.g1.o0.pick}}" aria-label="Sunday" style="height: 44px; border-radius: 12px; border: {{g.g1.o0.v0}}; background: {{g.g1.o0.v1}}; color: {{g.g1.o0.v2}}; font: {{g.g1.o0.v3}}; cursor: pointer">S</button>
<button aria-pressed="{{g.g1.o1.on}}" onClick="{{g.g1.o1.pick}}" aria-label="Monday" style="height: 44px; border-radius: 12px; border: {{g.g1.o1.v0}}; background: {{g.g1.o1.v1}}; color: {{g.g1.o1.v2}}; font: {{g.g1.o1.v3}}; cursor: pointer">M</button>
<button aria-pressed="{{g.g1.o2.on}}" onClick="{{g.g1.o2.pick}}" aria-label="Tuesday" style="height: 44px; border-radius: 12px; border: {{g.g1.o2.v0}}; background: {{g.g1.o2.v1}}; color: {{g.g1.o2.v2}}; font: {{g.g1.o2.v3}}; cursor: pointer">T</button>
<button aria-pressed="{{g.g1.o3.on}}" onClick="{{g.g1.o3.pick}}" aria-label="Wednesday" style="height: 44px; border-radius: 12px; border: {{g.g1.o3.v0}}; background: {{g.g1.o3.v1}}; color: {{g.g1.o3.v2}}; font: {{g.g1.o3.v3}}; cursor: pointer">W</button>
<button aria-pressed="{{g.g1.o4.on}}" onClick="{{g.g1.o4.pick}}" aria-label="Thursday" style="height: 44px; border-radius: 12px; border: {{g.g1.o4.v0}}; background: {{g.g1.o4.v1}}; color: {{g.g1.o4.v2}}; font: {{g.g1.o4.v3}}; cursor: pointer">T</button>
<button aria-pressed="{{g.g1.o5.on}}" onClick="{{g.g1.o5.pick}}" aria-label="Friday" style="height: 44px; border-radius: 12px; border: {{g.g1.o5.v0}}; background: {{g.g1.o5.v1}}; color: {{g.g1.o5.v2}}; font: {{g.g1.o5.v3}}; cursor: pointer">F</button>
<button aria-pressed="{{g.g1.o6.on}}" onClick="{{g.g1.o6.pick}}" aria-label="Saturday" style="height: 44px; border-radius: 12px; border: {{g.g1.o6.v0}}; background: {{g.g1.o6.v1}}; color: {{g.g1.o6.v2}}; font: {{g.g1.o6.v3}}; cursor: pointer">S</button>
</div>
</section>

<a href="Alerts.dc.html" style="min-height: 52px; border-radius: 16px; background: #5AB0FF; color: #06121F; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Save to watch</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
cfg() { return {"sw": {"s0": true}, "g": {"g0": {"multi": false, "init": [1], "keys": ["border", "background", "color", "font"], "n": 3, "sel": ["0", "#5AB0FF", "#06121F", "800 15px Manrope, sans-serif"], "uns": ["1px solid #2B3440", "transparent", "#C9D1DB", "700 15px Manrope, sans-serif"]}, "g1": {"multi": true, "init": [1, 2, 3, 4, 5], "keys": ["border", "background", "color", "font"], "n": 7, "sel": ["0", "#5AB0FF", "#06121F", "800 14px Manrope, sans-serif"], "uns": ["1px solid #2B3440", "transparent", "#9AA4B2", "700 14px Manrope, sans-serif"]}}}; }

renderVals() {
const C = this.cfg(), st = this.state || {};
const sw = {};
Object.keys(C.sw).forEach((id) => {
const on = st['sw_' + id] === undefined ? C.sw[id] : st['sw_' + id];
sw[id] = { on: on, bg: on ? '#5AB0FF' : '#3A4452', jc: on ? 'flex-end' : 'flex-start', knob: on ? '#FFFFFF' : '#C9D1DB',
toggle: () => this.setState({ ['sw_' + id]: !on }) };
});
const g = {};
Object.keys(C.g).forEach((gid) => {
const G = C.g[gid];
const cur = st['g_' + gid] || G.init;
g[gid] = {};
for (let k = 0; k < G.n; k++) {
const on = cur.indexOf(k) >= 0;
const src = on ? G.sel : G.uns;
const o = { on: on, pick: () => {
const next = G.multi ? (on ? cur.filter((x) => x !== k) : cur.concat([k])) : [k];
this.setState({ ['g_' + gid]: next });
} };
G.keys.forEach((key, i) => { o['v' + i] = src[i]; });
g[gid]['o' + k] = o;
}
});
return Object.assign({ sw: sw, g: g }, this.extra ? this.extra(st, g) : {});
}
}
</script>
</body>
</html>
