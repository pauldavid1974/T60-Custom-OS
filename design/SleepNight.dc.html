<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One night's sleep</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#8CC8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C0F; color: #F2F4F7; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
<a href="Health.dc.html" aria-label="Back to Health" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5AB0FF; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Sleep</h1>
</header>

<main style="flex: 1; overflow: hidden; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Previous night" onClick="{{prev}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2B3440; background: #14181E; color: #F2F4F7; font: 700 18px Manrope, sans-serif">‹</button>
<span style="font-size: 15px; font-weight: 700">{{night}}</span>
<button aria-label="Next night" onClick="{{next}}" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2B3440; background: #14181E; color: #8792A2; font: 700 18px Manrope, sans-serif">›</button>
</div>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 40px; font-weight: 600">{{total}}</span>
<span style="font-size: 14px; color: #9AA4B2">11:02 PM – 6:41 AM</span>
</div>
<div style="display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px">
<div style="display: grid; grid-template-rows: repeat(4, 22px); font-size: 11px; color: #8792A2; align-items: center"><span>Awake</span><span>REM</span><span>Light</span><span>Deep</span></div>
<div style="height: 88px; display: flex; gap: 1px">
<div style="flex: 3; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 6; margin-top: 66px; height: 22px; background: #3B4BB8; border-radius: 3px"></div>
<div style="flex: 5; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 3; margin-top: 22px; height: 22px; background: #C9D0FF; border-radius: 3px"></div>
<div style="flex: 1; margin-top: 0; height: 22px; background: #FFB38A; border-radius: 3px"></div>
<div style="flex: 6; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 4; margin-top: 66px; height: 22px; background: #3B4BB8; border-radius: 3px"></div>
<div style="flex: 7; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 4; margin-top: 22px; height: 22px; background: #C9D0FF; border-radius: 3px"></div>
<div style="flex: 6; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 2; margin-top: 66px; height: 22px; background: #3B4BB8; border-radius: 3px"></div>
<div style="flex: 5; margin-top: 44px; height: 22px; background: #7C8CF5; border-radius: 3px"></div>
<div style="flex: 4; margin-top: 22px; height: 22px; background: #C9D0FF; border-radius: 3px"></div>
<div style="flex: 1; margin-top: 0; height: 22px; background: #FFB38A; border-radius: 3px"></div>
</div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #8792A2; padding-left: 56px"><span>11 PM</span><span>1 AM</span><span>3 AM</span><span>5 AM</span></div>
</section>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 4px 16px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="width: 12px; height: 12px; border-radius: 3px; background: #3B4BB8"></span><span style="flex: 1; font-size: 15px">Deep</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">1h 38m</span><span style="width: 44px; text-align: right; font-size: 13px; color: #9AA4B2">22%</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="width: 12px; height: 12px; border-radius: 3px; background: #7C8CF5"></span><span style="flex: 1; font-size: 15px">Light</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">4h 09m</span><span style="width: 44px; text-align: right; font-size: 13px; color: #9AA4B2">56%</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="width: 12px; height: 12px; border-radius: 3px; background: #C9D0FF"></span><span style="flex: 1; font-size: 15px">REM</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">1h 20m</span><span style="width: 44px; text-align: right; font-size: 13px; color: #9AA4B2">18%</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FFB38A"></span><span style="flex: 1; font-size: 15px">Awake</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">17m</span><span style="width: 44px; text-align: right; font-size: 13px; color: #9AA4B2">4%</span></div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
cfg() { return {"sw": {}, "g": {}}; }
extra(st) { const i = st.i || 0;
const nights = ['Fri, Oct 24 → Sat, Oct 25', 'Thu, Oct 23 → Fri, Oct 24', 'Wed, Oct 22 → Thu, Oct 23'];
const totals = ['7h 24m', '6h 51m', '7h 02m'];
return { night: nights[i], total: totals[i], prev: () => this.setState({ i: Math.min(2, i + 1) }), next: () => this.setState({ i: Math.max(0, i - 1) }) }; }

renderVals() {
const C = this.cfg(), st = this.state || {};
const sw = {};
Object.keys(C.sw).forEach((id) => {
const on = st['sw_' + id] === undefined ? C.sw[id] : st['sw_' + id];
sw[id] = { on: on, bg: on ? '#5AB0FF' : '#3A4452', jc: on ? 'flex-end' : 'flex-start', knob: on ? '#FFFFFF' : '#C9D1DB',
toggle: () => this.setState({ ['sw_' + id]: !on }) };
});
const g = {};
Object.keys(C.g).forEach((gid) => {
const G = C.g[gid];
const cur = st['g_' + gid] || G.init;
g[gid] = {};
for (let k = 0; k < G.n; k++) {
const on = cur.indexOf(k) >= 0;
const src = on ? G.sel : G.uns;
const o = { on: on, pick: () => {
const next = G.multi ? (on ? cur.filter((x) => x !== k) : cur.concat([k])) : [k];
this.setState({ ['g_' + gid]: next });
} };
G.keys.forEach((key, i) => { o['v' + i] = src[i]; });
g[gid]['o' + k] = o;
}
});
return Object.assign({ sw: sw, g: g }, this.extra ? this.extra(st, g) : {});
}
}
</script>
</body>
</html>
