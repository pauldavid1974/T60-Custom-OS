<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blood oxygen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#8CC8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C0F; color: #F2F4F7; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
<a href="Health.dc.html" aria-label="Back to Health" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5AB0FF; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Blood oxygen</h1>
</header>

<main style="flex: 1; overflow: hidden; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 64px; font-weight: 600; color: #5AB0FF">{{val}}</span>
<span style="font-size: 14px; color: #9AA4B2">{{when}}</span>
<span style="font-size: 13px; color: #C9D1DB">95% and above is the normal range</span>
</section>

<button style="min-height: 52px; border: 0; border-radius: 16px; background: #5AB0FF; color: #06121F; font: 800 16px Manrope, sans-serif; cursor: pointer" onClick="{{measure}}">{{label}}</button>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column">
<h2 style="margin: 0 0 6px; font-size: 14px; font-weight: 700; color: #9AA4B2">This week</h2>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><span>Sat</span><div style="height: 8px; border-radius: 999px; background: #232A33; position: relative"><div style="position: absolute; left: 50%; width: 40%; height: 100%; border-radius: 999px; background: #5AB0FF"></div></div><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">95–99</span></div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><span>Fri</span><div style="height: 8px; border-radius: 999px; background: #232A33; position: relative"><div style="position: absolute; left: 60%; width: 30%; height: 100%; border-radius: 999px; background: #5AB0FF"></div></div><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">96–98</span></div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><span>Thu</span><div style="height: 8px; border-radius: 999px; background: #232A33; position: relative"><div style="position: absolute; left: 40%; width: 50%; height: 100%; border-radius: 999px; background: #5AB0FF"></div></div><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">94–99</span></div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><span>Wed</span><div style="height: 8px; border-radius: 999px; background: #232A33; position: relative"><div style="position: absolute; left: 60%; width: 40%; height: 100%; border-radius: 999px; background: #5AB0FF"></div></div><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">96–100</span></div>
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 72px; align-items: center; gap: 12px; min-height: 40px; font-size: 14px"><span>Tue</span><div style="height: 8px; border-radius: 999px; background: #232A33; position: relative"><div style="position: absolute; left: 50%; width: 40%; height: 100%; border-radius: 999px; background: #5AB0FF"></div></div><span style="font-family: 'IBM Plex Mono', monospace; text-align: right">95–99</span></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #8792A2; padding: 4px 68px 0"><span>90%</span><span>100%</span></div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
cfg() { return {"sw": {}, "g": {}}; }
extra(st) { return { measure: () => this.setState({ m: true }),
label: st.m ? 'Measured just now' : 'Measure now · keep still 30 sec', val: st.m ? '98%' : '97%', when: st.m ? 'Measured just now' : 'Measured at 7:12 PM' }; }

renderVals() {
const C = this.cfg(), st = this.state || {};
const sw = {};
Object.keys(C.sw).forEach((id) => {
const on = st['sw_' + id] === undefined ? C.sw[id] : st['sw_' + id];
sw[id] = { on: on, bg: on ? '#5AB0FF' : '#3A4452', jc: on ? 'flex-end' : 'flex-start', knob: on ? '#FFFFFF' : '#C9D1DB',
toggle: () => this.setState({ ['sw_' + id]: !on }) };
});
const g = {};
Object.keys(C.g).forEach((gid) => {
const G = C.g[gid];
const cur = st['g_' + gid] || G.init;
g[gid] = {};
for (let k = 0; k < G.n; k++) {
const on = cur.indexOf(k) >= 0;
const src = on ? G.sel : G.uns;
const o = { on: on, pick: () => {
const next = G.multi ? (on ? cur.filter((x) => x !== k) : cur.concat([k])) : [k];
this.setState({ ['g_' + gid]: next });
} };
G.keys.forEach((key, i) => { o['v' + i] = src[i]; });
g[gid]['o' + k] = o;
}
});
return Object.assign({ sw: sw, g: g }, this.extra ? this.extra(st, g) : {});
}
}
</script>
</body>
</html>
