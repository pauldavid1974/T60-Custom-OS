<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick replies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5AB0FF}a:hover{color:#8CC8FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C0F; color: #F2F4F7; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 8px">
<a href="Alerts.dc.html" aria-label="Back to Alerts" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5AB0FF; text-decoration: none"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Quick replies</h1>
</header>

<main style="flex: 1; overflow: hidden; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<p style="margin: 0 4px; font-size: 14px; color: #C9D1DB; line-height: 1.5">When a text arrives, pick one of these on the watch and your phone sends it.</p>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 4px 16px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px">
<span style="font-size: 15px; font-weight: 600">Allow replies from watch</span>
<button aria-pressed="{{sw.s0.on}}" aria-label="Allow replies from watch" onClick="{{sw.s0.toggle}}" style="width: 50px; height: 30px; border: 0; border-radius: 999px; background: {{sw.s0.bg}}; padding: 3px; display: flex; justify-content: {{sw.s0.jc}}; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 50%; background: {{sw.s0.knob}}"></span></button>
</div>
</section>

<section style="background: #14181E; border: 1px solid #232A33; border-radius: 20px; padding: 12px 16px 4px; display: flex; flex-direction: column">
<h2 style="margin: 0 0 4px; font-size: 14px; font-weight: 700; color: #9AA4B2">Your replies</h2>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="flex: 1; font-size: 15px">On my way.</span><a href="EditReply.dc.html" aria-label="Edit reply" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA4B2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="flex: 1; font-size: 15px">Can't talk now, I'll call you back.</span><a href="EditReply.dc.html" aria-label="Edit reply" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA4B2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="flex: 1; font-size: 15px">Yes</span><a href="EditReply.dc.html" aria-label="Edit reply" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA4B2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #232A33"><span style="flex: 1; font-size: 15px">No</span><a href="EditReply.dc.html" aria-label="Edit reply" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA4B2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px"><span style="flex: 1; font-size: 15px">Thanks!</span><a href="EditReply.dc.html" aria-label="Edit reply" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9AA4B2"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a></div>
</section>

<a href="EditReply.dc.html" style="min-height: 52px; box-sizing: border-box; border-radius: 16px; border: 1px dashed #3A4452; color: #5AB0FF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">+ Add a reply</a>
<p style="margin: 0 4px; font-size: 13px; color: #9AA4B2; line-height: 1.5">Needs permission to send texts. The reply goes from your phone number as a normal text.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
cfg() { return {"sw": {"s0": true}, "g": {}}; }

renderVals() {
const C = this.cfg(), st = this.state || {};
const sw = {};
Object.keys(C.sw).forEach((id) => {
const on = st['sw_' + id] === undefined ? C.sw[id] : st['sw_' + id];
sw[id] = { on: on, bg: on ? '#5AB0FF' : '#3A4452', jc: on ? 'flex-end' : 'flex-start', knob: on ? '#FFFFFF' : '#C9D1DB',
toggle: () => this.setState({ ['sw_' + id]: !on }) };
});
const g = {};
Object.keys(C.g).forEach((gid) => {
const G = C.g[gid];
const cur = st['g_' + gid] || G.init;
g[gid] = {};
for (let k = 0; k < G.n; k++) {
const on = cur.indexOf(k) >= 0;
const src = on ? G.sel : G.uns;
const o = { on: on, pick: () => {
const next = G.multi ? (on ? cur.filter((x) => x !== k) : cur.concat([k])) : [k];
this.setState({ ['g_' + gid]: next });
} };
G.keys.forEach((key, i) => { o['v' + i] = src[i]; });
g[gid]['o' + k] = o;
}
});
return Object.assign({ sw: sw, g: g }, this.extra ? this.extra(st, g) : {});
}
}
</script>
</body>
</html>
